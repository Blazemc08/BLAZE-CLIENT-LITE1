name: Build ClientUtils v3 (Fabric 1.21.11)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Resolve Fabric versions and write project files
        run: |
          set -e
          MC=1.21.11
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "MC=$MC YARN=$YARN LOADER=$LOADER API=$API"
          if [ -z "$YARN" ] || [ -z "$LOADER" ] || [ -z "$API" ]; then echo "Gagal mengambil versi Fabric"; exit 1; fi

          mkdir -p mod && cd mod
          mkdir -p src/main/java/com/example/clientutils/mixin
          mkdir -p src/main/resources/assets/clientutils/lang

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=$MC
          yarn_mappings=$YARN
          loader_version=$LOADER
          fabric_version=$API
          mod_version=3.0.0
          maven_group=com.example
          archives_base_name=clientutils
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'clientutils'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "clientutils",
            "version": "${version}",
            "name": "Client Utils",
            "description": "Client mod: mod menu UI, waypoints, swappers, crosshair, keystrokes, freelook, xray, fullbright, auto totem, afk fishing.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.clientutils.ClientUtilsMod"]
            },
            "mixins": ["clientutils.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/clientutils.mixins.json <<'EOF'
          {
            "required": false,
            "minVersion": "0.8",
            "package": "com.example.clientutils.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "EntityMixin",
              "CameraMixin",
              "BlockMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          EOF

          cat > src/main/resources/assets/clientutils/lang/en_us.json <<'EOF'
          {
            "key.category.clientutils.main": "Client Utils",
            "key.clientutils.open": "Open Mod Menu",
            "key.clientutils.elytra": "Elytra Swapper",
            "key.clientutils.pearl": "Ender Pearl + Wind Charge",
            "key.clientutils.spear": "Spear Lunge Swapper",
            "key.clientutils.tnt": "Rail + TNT Cart",
            "key.clientutils.freelook": "Freelook (hold)"
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/EntityMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Freelook;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.Entity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(Entity.class)
          public abstract class EntityMixin {
              @Inject(method = "changeLookDirection", at = @At("HEAD"), cancellable = true, require = 0)
              private void clientutils$freelookTurn(double dx, double dy, CallbackInfo ci) {
                  if (Freelook.active && (Object) this instanceof ClientPlayerEntity) {
                      Freelook.turn(dx, dy);
                      ci.cancel();
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/CameraMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Freelook;
          import net.minecraft.client.render.Camera;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;

          @Mixin(Camera.class)
          public abstract class CameraMixin {
              @ModifyVariable(method = "setRotation", at = @At("HEAD"), argsOnly = true, ordinal = 0, require = 0)
              private float clientutils$yaw(float yaw) {
                  return Freelook.active ? Freelook.yaw : yaw;
              }

              @ModifyVariable(method = "setRotation", at = @At("HEAD"), argsOnly = true, ordinal = 1, require = 0)
              private float clientutils$pitch(float pitch) {
                  return Freelook.active ? Freelook.pitch : pitch;
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/mixin/BlockMixin.java <<'EOF'
          package com.example.clientutils.mixin;

          import com.example.clientutils.Config;
          import com.example.clientutils.Xray;
          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.util.math.Direction;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(Block.class)
          public abstract class BlockMixin {
              @Inject(method = "shouldDrawSide", at = @At("HEAD"), cancellable = true, require = 0)
              private static void clientutils$xray(BlockState state, BlockState otherState, Direction side,
                                                   CallbackInfoReturnable<Boolean> cir) {
                  if (Config.get().xray) {
                      cir.setReturnValue(Xray.visible(state.getBlock()));
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Config.java <<'EOF'
          package com.example.clientutils;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          public class Config {
              public static class Waypoint {
                  public String name = "Waypoint";
                  public String dim = "minecraft:overworld";
                  public int x, y, z;
                  public int color = 0x55FF55;
              }

              public boolean healthIndicator = true;
              public boolean waypoints = true;
              public boolean waypointArrow = true;
              public boolean waypointList = true;
              public boolean waypointDistance = true;
              public boolean coordinates = false;

              public boolean elytraSwapper = true;
              public boolean pearlSwapper = true;
              public boolean windCombo = true;
              public boolean spearSwapper = true;

              public boolean crosshair = true;
              public int crosshairStyle = 3;
              public int crosshairSize = 1;
              public int crosshairColor = 0xFFFFFF;
              public int crosshairTargetColor = 0xFF0000;

              public boolean keystrokes = true;
              public boolean keystrokesMouse = true;
              public boolean keystrokesSpace = true;
              public boolean fps = true;
              public boolean cps = true;

              // fitur baru
              public boolean freelook = true;
              public boolean xray = false;
              public boolean fullbright = false;
              public boolean tntCart = true;
              public boolean autoTotem = false;
              public boolean afkFishing = false;

              public List<Waypoint> list = new ArrayList<>();

              private static Config INSTANCE = new Config();
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("clientutils.json");
              }

              public static Config get() {
                  return INSTANCE;
              }

              public static void load() {
                  try {
                      Path p = path();
                      if (Files.exists(p)) {
                          Config c = GSON.fromJson(Files.readString(p), Config.class);
                          if (c != null) {
                              if (c.list == null) c.list = new ArrayList<>();
                              INSTANCE = c;
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static void save() {
                  try {
                      Files.writeString(path(), GSON.toJson(INSTANCE));
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static void resetFeatures() {
                  boolean wasXray = INSTANCE.xray;
                  Config n = new Config();
                  n.list = INSTANCE.list;
                  INSTANCE = n;
                  save();
                  if (wasXray) Xray.reload();
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/ClientUtilsMod.java <<'EOF'
          package com.example.clientutils;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class ClientUtilsMod implements ClientModInitializer {
              public static KeyBinding openKey, elytraKey, pearlKey, spearKey, tntKey, freelookKey;

              @Override
              public void onInitializeClient() {
                  Config.load();

                  KeyBinding.Category cat = KeyBinding.Category.create(Identifier.of("clientutils", "main"));
                  openKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils.open", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_U, cat));
                  elytraKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils.elytra", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_R, cat));
                  pearlKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils.pearl", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_Y, cat));
                  spearKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils.spear", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_F, cat));
                  tntKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils.tnt", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_K, cat));
                  freelookKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientutils.freelook", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_LEFT_ALT, cat));

                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      Swappers.tick(mc);
                      Freelook.tick(mc);
                      Extras.tick(mc);
                      AfkFish.tick(mc);
                      if (mc.player == null || mc.world == null) return;

                      while (openKey.wasPressed()) {
                          if (mc.currentScreen == null) mc.setScreen(new ModMenuScreen(0));
                      }
                      while (elytraKey.wasPressed()) {
                          if (mc.currentScreen == null && Config.get().elytraSwapper) Swappers.elytra(mc);
                      }
                      while (pearlKey.wasPressed()) {
                          if (mc.currentScreen == null && Config.get().pearlSwapper) Swappers.pearl(mc);
                      }
                      while (spearKey.wasPressed()) {
                          if (mc.currentScreen == null && Config.get().spearSwapper) Swappers.spear(mc);
                      }
                      while (tntKey.wasPressed()) {
                          if (mc.currentScreen == null && Config.get().tntCart) Swappers.tntCart(mc);
                      }
                  });

                  HudElementRegistry.addLast(Identifier.of("clientutils", "hud"), Hud::render);

                  HudElementRegistry.replaceElement(VanillaHudElements.CROSSHAIR, original -> (ctx, tick) -> {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (Config.get().crosshair && mc.options.getPerspective().isFirstPerson()) {
                          Crosshair.renderHud(ctx, mc);
                      } else {
                          original.render(ctx, tick);
                      }
                  });
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Freelook.java <<'EOF'
          package com.example.clientutils;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.Perspective;

          public class Freelook {
              public static boolean active;
              public static float yaw, pitch;
              private static Perspective prev;

              public static void tick(MinecraftClient mc) {
                  boolean want = Config.get().freelook
                          && mc.player != null
                          && mc.currentScreen == null
                          && ClientUtilsMod.freelookKey != null
                          && ClientUtilsMod.freelookKey.isPressed();

                  if (want && !active) {
                      active = true;
                      yaw = mc.player.getYaw();
                      pitch = mc.player.getPitch();
                      prev = mc.options.getPerspective();
                      mc.options.setPerspective(Perspective.THIRD_PERSON_BACK);
                  } else if (!want && active) {
                      active = false;
                      if (prev != null) mc.options.setPerspective(prev);
                      prev = null;
                  }
              }

              public static void turn(double dx, double dy) {
                  yaw += (float) dx * 0.15f;
                  pitch += (float) dy * 0.15f;
                  if (pitch > 90f) pitch = 90f;
                  if (pitch < -90f) pitch = -90f;
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Xray.java <<'EOF'
          package com.example.clientutils;

          import net.minecraft.block.Block;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.registry.Registries;

          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;

          public class Xray {
              private static final Map<Block, Boolean> CACHE = new ConcurrentHashMap<>();

              public static boolean visible(Block b) {
                  return CACHE.computeIfAbsent(b, k -> {
                      String p = Registries.BLOCK.getId(k).getPath();
                      return p.endsWith("_ore")
                              || p.equals("ancient_debris")
                              || p.equals("gilded_blackstone")
                              || p.equals("chest")
                              || p.equals("trapped_chest")
                              || p.equals("ender_chest")
                              || p.equals("spawner")
                              || p.equals("lava");
                  });
              }

              /** Bangun ulang chunk supaya perubahan ON/OFF langsung terlihat. */
              public static void reload() {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.worldRenderer != null && mc.world != null) {
                      mc.worldRenderer.reload();
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/clientutils/Extras.java <<'EOF'
